<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge"> 
    <title>Amazon</title>
    <!-- Font Awesome : this is a CDN link for the Font Awesome icons which helps in adding icons to the webpage from the Font Awesome library. Like a open source library.-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <! Start with the nav bar section -->
    <div class="nav-bar">
        <div class="navlogo border">
            <div class="logo"></div>
        </div>
        

        <div class="nav-address border">
            <p class="add-1">Deliver to</p>
            <div class="add-icon">
                <i class="fa-solid fa-location-crosshairs"></i>
                <p class="add-2">India</p>
            </div>

        </div>

        <div class="nav-search">
            <select class="search-select">
                <option>All</option>
            </select>
            <input class="search-input" type="text" placeholder="Search Amazon">
            <div class="search-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>

        <div class="nav-sign-in border">
            <p><span>Hello, sign in</span></p>
            <p class="nav-second">Account & Lists</p>
        </div>

        <div class="nav-orders border">
            <p><span>Returns</span></p>
            <p class="nav-2-orders">& Orders</p>
        </div>

        <div class="nav-cart border">
            <i class="fa-solid fa-cart-shopping"></i>
            <p >Cart</p>

        </div>  
    </div>
</body>
</html>
